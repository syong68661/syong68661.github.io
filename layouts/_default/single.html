{{ define "main" }}
  <article class="article">
    <p class="post-meta">{{ .Date.Format "2006-01-02" }} · {{ .Section | upper }}</p>
    <h1>{{ .Title }}</h1>
    {{ with .Params.summary }}<p class="lead">{{ . }}</p>{{ end }}
    <div class="content">
      {{ .Content }}
    </div>
    {{ with .Params.tags }}
      <div class="tag-row">
        {{ range . }}
          <span class="tag">{{ . }}</span>
        {{ end }}
      </div>
    {{ end }}
  </article>
{{ end }}
